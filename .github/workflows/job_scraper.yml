name: Technopark Job Scraper

on:
  schedule:
    # Run every day at 04:30 UTC (10:00 AM IST)
    - cron: '30 4 * * *'
  workflow_dispatch: # Allow manual triggering from GitHub UI

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    # Grant permissions to push the updated database back to the repository
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip' # Caches dependencies to speed up runs

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Job Scraper
      env:
        TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        KEYWORDS: ${{ vars.KEYWORDS }} # Use a Repository Variable for easier editing without hiding it
      run: python run.py

    - name: Commit and push updated database
      uses: stefanzweifel/git-auto-commit-action@v5
      with:
        commit_message: "chore: update notified jobs database"
        file_pattern: "jobs.db"
